name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - codex/work-gallery-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Validate design tokens
        run: |
          node --test scripts/validate-design-tokens.node.mjs
          node scripts/validate-design-tokens.mjs

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ce8252d67fbf479d9b9e1d5812402efb
        run: npx --yes wrangler@4 pages deploy "$GITHUB_WORKSPACE/dist" --project-name=med-utopia --branch="${{ github.ref_name }}"

      - name: Cloudflare token not configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN is not configured in this GitHub repository. Build and tests passed, but Cloudflare deployment was skipped."
